<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="725.22523" height="432.43243" viewBox="0,0,725.22523,432.43243"><g transform="translate(42.61261,36.21621)"><g stroke-miterlimit="10"><text transform="translate(5,32.12052) scale(0.69128,0.69128)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Archivo Narrow&quot;, Archivo" font-weight="400" text-anchor="start"><tspan x="0" dy="0">Catbee's Homepage - Released</tspan></text><text transform="translate(5,276.86527) scale(0.69128,0.69128)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Archivo Narrow&quot;, Archivo" font-weight="400" text-anchor="start"><tspan x="0" dy="0">Arrasify</tspan></text><text transform="translate(6.5,54.5) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Archivo Narrow&quot;, Archivo" font-weight="400" text-anchor="start"><tspan x="0" dy="0">I don't really plan to do much with this... but its out now as of 9/20/26.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Pretty impressive that I managed to make this with 0 effort. Includes</tspan><tspan x="0" dy="48px">scroll mechanics and a 16:9 aspect ratio (glad that Penguinmod supports</tspan><tspan x="0" dy="48px">that...)</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Also always attempts to render at 120 FPS with Interpolation turned on.</tspan></text><text transform="translate(6.5,302.24775) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Archivo Narrow&quot;, Archivo" font-weight="400" text-anchor="start"><tspan x="0" dy="0">Arrasify, unfortunately, is not online right now, due to a Bandwidth issue MLG</tspan><tspan x="0" dy="48px">overlooked.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Once it is back online, I will be on there if you need anything :3</tspan></text><path d="M-42.61261,396.21622v-432.43243h725.22523v432.43243z" fill="none" stroke="#000000" stroke-width="0"/></g></g></svg>